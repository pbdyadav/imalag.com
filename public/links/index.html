<meta charset="utf-8">

<title>Archana Lippan Art Gallery | All Links</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }

body {
  margin: 0; 
  min-height: 100vh; 
  display: flex; 
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif; 
  
  /* Lippan Art Background from public folder */
  background: url('/3.png') center top / cover no-repeat fixed;
  color: #3b1807;
  position: relative;
  overflow-x: hidden;
}

/* Light overlay to make background smooth */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255, 255, 255, 0.15);
  z-index: 0;
}

/* Original Main Structure - Max Space Use */
main { 
  width: min(680px, 92vw); 
  padding: 34px 0 45px; 
  text-align: center; 
  position: relative;
  z-index: 2;
}

/* Hanging Lamps */
.lamp {
  position: fixed;
  top: 0;
  z-index: 3;
  pointer-events: none;
  filter: drop-shadow(2px 6px 8px rgba(0, 0, 0, 0.25));
}
.lamp-left { left: 2%; width: 65px; }
.lamp-right { right: 2%; width: 75px; }

@media (max-width: 600px) {
  .lamp-left { left: 0; width: 42px; }
  .lamp-right { right: 0; width: 48px; }
}

.logo { 
  max-width: 260px; 
  width: 65%; 
  margin: 0 auto 12px; 
  display: block;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
}

h1 { 
  margin: 8px 0 5px; 
  font-size: 26px; 
  color: #2b1103;
  font-weight: bold;
  text-shadow: 0 1px 2px rgba(255,255,255,0.8);
}

p { 
  color: #57270a; 
  margin: 0 0 24px; 
  font-weight: bold;
  font-size: 17px;
}

/* Buttons using full available width & high contrast */
a {
  display: block; 
  text-decoration: none; 
  color: #f7ead7;
  border: 1.5px solid #a86c32; 
  border-radius: 16px;
  padding: 17px 20px; 
  margin: 12px 0;
  background: linear-gradient(135deg, #2e170a, #1a0b03);
  font-size: 19px; 
  font-weight: 600;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
  transition: all 0.2s ease;
}

a:hover, a:active { 
  border-color: #e0a45a; 
  transform: translateY(-1px); 
  background: linear-gradient(135deg, #3b1e0d, #240e04);
}

.small { 
  font-size: 14px; 
  color: #57270a; 
  margin-top: 24px; 
  font-weight: bold;
  letter-spacing: 1px;
}
</style>
</head>

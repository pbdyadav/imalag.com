<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archana Lippan Art Gallery | All Links</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }

body {
  margin: 0; 
  min-height: 100vh; 
  display: flex; 
  justify-content: center;
  align-items: center;
  font-family: 'Segoe UI', Arial, sans-serif; 
  /* Lippan Art Background Image (3.png from public folder) */
  background: url('/3.png') no-repeat center center fixed;
  background-size: cover;
  color: #3b1c0c;
  position: relative;
  overflow-x: hidden;
}

/* Background overlay for smooth contrast */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(253, 250, 245, 0.25);
  z-index: 0;
}

/* Main Container Box */
main { 
  position: relative;
  z-index: 2;
  width: min(620px, 92vw); 
  padding: 38px 24px 40px; 
  margin: 30px 0;
  text-align: center; 
  background: rgba(255, 252, 247, 0.82);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 28px;
  border: 1.5px solid rgba(184, 134, 71, 0.4);
  box-shadow: 0 15px 35px rgba(80, 45, 15, 0.12), inset 0 0 15px rgba(255,255,255,0.8);
}

/* Hanging Lamps Styling */
.lamp {
  position: fixed;
  top: 0;
  z-index: 3;
  pointer-events: none;
  filter: drop-shadow(2px 8px 10px rgba(80, 40, 10, 0.25));
}
.lamp-left { left: 3%; width: 75px; }
.lamp-right { right: 3%; width: 90px; }

@media (max-width: 600px) {
  .lamp-left { left: 1%; width: 48px; }
  .lamp-right { right: 1%; width: 58px; }
  main { padding: 28px 16px 30px; }
}

.logo { 
  max-width: 250px; 
  width: 70%; 
  margin: 0 auto 10px; 
  display: block;
  filter: drop-shadow(0 4px 8px rgba(70,30,10,0.15));
}

h1 { 
  margin: 10px 0 4px; 
  font-size: 26px; 
  color: #4a2110; 
  font-weight: 700;
  letter-spacing: 0.5px;
}

p { 
  color: #7a4f32; 
  margin: 0 0 24px; 
  font-size: 16px;
  font-weight: 600;
}

/* Link Cards */
.link-card {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  text-decoration: none; 
  color: #3b1c0c;
  border: 1.5px solid #c48b55; 
  border-radius: 18px;
  padding: 14px 20px; 
  margin: 14px 0;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(248, 240, 228, 0.9));
  font-size: 18px; 
  font-weight: 600;
  box-shadow: 0 4px 12px rgba(120, 70, 30, 0.08);
  transition: all 0.25s ease;
  text-align: left;
}

.link-card:hover { 
  border-color: #8c4a1b; 
  transform: translateY(-2px); 
  box-shadow: 0 8px 20px rgba(120, 70, 30, 0.18);
  background: #ffffff;
}

.icon {
  font-size: 22px;
  margin-right: 14px;
  width: 32px;
  text-align: center;
}

.link-text {
  display: flex;
  flex-direction: column;
}

.link-text .sub {
  font-size: 13px;
  color: #8a5a38;
  font-weight: 500;
  margin-top: 2px;
}

.small { 
  font-size: 14px; 
  color: #7d573c; 
  margin-top: 26px; 
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}
</style>
</head>
